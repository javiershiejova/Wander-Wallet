# GitHub switches off scheduled jobs in a repository that has had no changes for 60 days.
# Once a month this records today's date in .github/keepalive.txt, which counts as a change,
# so the "Keep database awake" job keeps running. The app itself is not touched.
name: Keep repository active

on:
  schedule:
    - cron: "23 4 1 * *"   # 1st of every month at 04:23 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the date
        run: |
          date -u +"Last automatic check-in: %Y-%m-%d %H:%M UTC" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Monthly check-in to keep scheduled jobs running" || echo "Nothing to commit"
          git push
