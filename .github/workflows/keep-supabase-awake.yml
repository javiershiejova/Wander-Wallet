# Free Supabase projects pause after 7 days without activity.
# This checks in with the database every 3 days so Wander Wallet doesn't go to sleep between trips.
# It only asks to read, and sends no trip link, so it gets nothing back and never touches your data.
name: Keep database awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days at 03:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check in with Supabase
        env:
          # The same public project address and public (anon) key the app uses in index.html.
          SUPABASE_URL: https://ufseixhixstajnxyrupq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmc2VpeGhpeHN0YWpueHlydXBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNDkwMzQsImV4cCI6MjEwOTcyNTAzNH0.5r5ApnJD9CSogXzpvlje6oI5njeBVDF7I2Pvcd3vaEc
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-trip-id: keep-awake-ping-0000")
          echo "Supabase answered with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase didn't answer normally (HTTP $code). If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
